# =============================================================================
# libmy_uvc_pip_helper（画中画合成静态库）相关配置
# -----------------------------------------------------------------------------
# 说明：本文件仅描述 PiP 行为——是否启用、叠加图路径、小窗位置与尺寸、合成 JPEG
#       质量等。将来 pip_helper 扩展网格/主讲人参数时，也应写在本区段。
# 区段名：必须使用 [libmy_uvc_pip]
# 依赖：通常仅当 video_codec=mjpeg 且应用链接 pip_helper 时生效。
# =============================================================================

[libmy_uvc_pip]

# 是否启用实时画中画：1=开，0=关（仅 MJPEG 路径有意义）
pip_enable = 1

# 叠加用 JPEG：单文件路径，或目录（多帧按文件名排序）；具体语义以 pip_helper 为准
pip_overlay_path = /userdata/pip_logo.jpg

# 小窗左上角坐标（像素）
pip_x = 20
pip_y = 20

# 小窗显示宽高（像素，须 >0）
pip_w = 640
pip_h = 480

# 合成后 MJPEG 质量 1~100
pip_jpeg_quality = 100

# 主讲人 / 各路 grid 无新数据超时（毫秒）：超过该时长仍未收到该路新帧则该路露背图；单调时钟计量。
# 键缺省或未写时按 5000。0 = 不因超时露背图（仅冻结上一帧）。正整数 = 自定义毫秒。
# pip_helper_create（C）：推荐 int32_t，-1 = 库缺省 5000，0 = 禁用超时，>0 = 毫秒（见设计 §2.4 v1.12）。
pip_overlay_stale_timeout_ms = 5000

# 下三分之一网格（§2.4）：0=关闭（仅主讲人）；1~16=槽位上限；须与画布尺寸可布局（见 pip_tile_layout.hpp）
pip_tile_n_tiles = 2
pip_tile_gap_px = 10
pip_tile_margin_px = 10
