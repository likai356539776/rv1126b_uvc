[my_uvc]
# 8路独立配置模板
channels = 8
width = 640
height = 480
fps = 20
loop_file = 1

h264_path = /userdata/ch0.h264
channel0_h264_path = /userdata/ch0.h264
channel1_h264_path = /userdata/ch0.h264
channel2_h264_path = /userdata/ch0.h264
channel3_h264_path = /userdata/ch0.h264
channel4_h264_path = /userdata/ch0.h264
channel5_h264_path = /userdata/ch0.h264
channel6_h264_path = /userdata/ch0.h264
channel7_h264_path = /userdata/ch0.h264

channel0_fps = 20
channel1_fps = 20
channel2_fps = 20
channel3_fps = 20
channel4_fps = 20
channel5_fps = 20
channel6_fps = 20
channel7_fps = 20

sync_to_idr_on_open = 1
inject_sps_pps_on_idr = 1
startup_prime_frames = 18

log_every_frames = 60
idle_sleep_ms = 10
log_level = 2
stats_enable = 1
stats_interval_sec = 2

