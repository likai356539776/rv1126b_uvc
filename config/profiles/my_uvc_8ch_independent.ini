[my_uvc]
# 8路独立配置模板
# video_codec: h264 | mjpeg（须与 my_uvc_usb_config.sh -f 一致；mjpeg 时请先配 gadget 为 MJPEG）
# h264_path / channelN_h264_path: h264=Annex-B；mjpeg=单图、拼接 JPEG 或目录（见 config/README_CONFIG.md 与分文件模板（libmy_uvc.ini 等））
channels = 8
width = 1920
height = 1080
fps = 30
video_codec = h264
loop_file = 1
prefer_host_fps = 1

# PiP（仅 MJPEG 模式生效；当前模板默认关闭）
pip_enable = 0
pip_overlay_path = /userdata/pip_logo.jpg
pip_x = 0
pip_y = 0
pip_w = 0
pip_h = 0
pip_jpeg_quality = 85

h264_path = /userdata/ch0.h264
channel0_h264_path = /userdata/ch0.h264
channel1_h264_path = /userdata/ch0.h264
channel2_h264_path = /userdata/ch0.h264
channel3_h264_path = /userdata/ch0.h264
channel4_h264_path = /userdata/ch0.h264
channel5_h264_path = /userdata/ch0.h264
channel6_h264_path = /userdata/ch0.h264
channel7_h264_path = /userdata/ch0.h264

channel0_fps = 30
channel1_fps = 30
channel2_fps = 30
channel3_fps = 30
channel4_fps = 30
channel5_fps = 30
channel6_fps = 30
channel7_fps = 30

sync_to_idr_on_open = 1
inject_sps_pps_on_idr = 1
startup_prime_frames = 18

log_every_frames = 60
idle_sleep_ms = 10
log_level = 2
stats_enable = 1
stats_interval_sec = 2

