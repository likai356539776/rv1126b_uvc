[my_uvc]
# 1路独立配置模板（默认产品）
# video_codec: h264 | mjpeg（须与 my_uvc_usb_config.sh -f 一致；mjpeg 时请先配 gadget 为 MJPEG）
# h264_path: h264=Annex-B；mjpeg=单 .jpg/.jpeg、多 JPEG 拼接（0xFFD8 分帧）、或目录（.jpg/.jpeg 按文件名排序）
channels = 1
width = 1920
height = 1080
fps = 30
video_codec = h264
loop_file = 1
prefer_host_fps = 1

# PiP（仅 MJPEG 模式生效；当前模板默认关闭）
pip_enable = 0
pip_overlay_path = /userdata/pip_logo.jpg
pip_x = 0
pip_y = 0
pip_w = 0
pip_h = 0
pip_jpeg_quality = 85

# 默认媒体路径（单路时可只配置 h264_path / channel0_h264_path）
h264_path = /userdata/ch0.h264
channel0_h264_path = /userdata/ch0.h264
channel0_fps = 30

# 开流鲁棒性
sync_to_idr_on_open = 1
inject_sps_pps_on_idr = 1
startup_prime_frames = 8

# 运行日志与统计
log_every_frames = 120
idle_sleep_ms = 10
log_level = 1
stats_enable = 1
stats_interval_sec = 5

