[my_uvc]
# 12路独立配置模板
# video_codec: h264 | mjpeg（须与 my_uvc_usb_config.sh -f 一致；mjpeg 时请先配 gadget 为 MJPEG）
# h264_path / channelN_h264_path: h264=Annex-B；mjpeg=单图、拼接 JPEG 或目录（见主模板 config/my_uvc.ini 说明）
channels = 12
width = 640
height = 480
fps = 30
video_codec = h264
loop_file = 1
prefer_host_fps = 1

# PiP（仅 MJPEG 模式生效；当前模板默认关闭）
pip_enable = 0
pip_overlay_path = /userdata/pip_logo.jpg
pip_x = 20
pip_y = 20
pip_w = 160
pip_h = 120
pip_jpeg_quality = 85

h264_path = /userdata/ch0.h264
channel0_h264_path = /userdata/ch0.h264
channel1_h264_path = /userdata/ch1.h264
channel2_h264_path = /userdata/ch2.h264
channel3_h264_path = /userdata/ch3.h264
channel4_h264_path = /userdata/ch4.h264
channel5_h264_path = /userdata/ch5.h264
channel6_h264_path = /userdata/ch6.h264
channel7_h264_path = /userdata/ch7.h264
channel8_h264_path = /userdata/ch8.h264
channel9_h264_path = /userdata/ch9.h264
channel10_h264_path = /userdata/ch10.h264
channel11_h264_path = /userdata/ch11.h264

channel0_fps = 30
channel1_fps = 30
channel2_fps = 30
channel3_fps = 30
channel4_fps = 30
channel5_fps = 30
channel6_fps = 30
channel7_fps = 30
channel8_fps = 30
channel9_fps = 30
channel10_fps = 30
channel11_fps = 30

sync_to_idr_on_open = 1
inject_sps_pps_on_idr = 1
startup_prime_frames = 20

log_every_frames = 60
idle_sleep_ms = 10
log_level = 2
stats_enable = 1
stats_interval_sec = 2

