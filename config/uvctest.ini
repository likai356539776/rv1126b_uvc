# =============================================================================
# uvctest / 应用测试程序相关配置
# -----------------------------------------------------------------------------
# 说明：本文件描述「从哪读媒体、每路覆盖、统计与周期日志」——与可执行测试程序
#       强相关，不属于 libmy_uvc 或 pip_helper 的 ABI。集成正式产品时，可用自家 ini
#       替代本文件，或只保留与产品相关的键。
# 区段名：必须使用 [uvctest]
# =============================================================================

[uvctest]

# 发送日志：每发送 N 帧打印一次（0=关闭）
log_every_frames = 120

# 是否打印多路统计：1=开，0=关
stats_enable = 1

# 统计打印周期（秒），1~3600
stats_interval_sec = 5

# 全局默认媒体路径：
#   video_codec=h264 时为 Annex-B 文件；
#   video_codec=mjpeg 时为单 JPEG、多 JPEG 拼接文件，或帧序列目录
h264_path = /userdata/200frames_count.h264

# 按路覆盖（N=0~15）；留空则回退到 h264_path / 全局 fps
channel0_h264_path = /userdata/200frames_count.h264
channel0_fps = 30

channel1_h264_path = /userdata/200frames_count_1.h264
channel1_fps = 30
