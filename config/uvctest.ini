# =============================================================================
# uvctest / 应用测试程序相关配置
# -----------------------------------------------------------------------------
# 说明：本文件描述「从哪读媒体、每路覆盖、统计与周期日志」——与可执行测试程序
#       强相关，不属于 libmy_uvc 或 pip_helper 的 ABI。集成正式产品时，可用自家 ini
#       替代本文件，或只保留与产品相关的键。
# 区段名：必须使用 [uvctest]
# =============================================================================

[uvctest]

# 发送日志：每发送 N 帧打印一次（0=关闭）
log_every_frames = 120

# 是否打印多路统计：1=开，0=关
stats_enable = 1

# 统计打印周期（秒），1~3600
stats_interval_sec = 5

# YOLO 目标检测置信度得分阈值：0.0 ~ 1.0 (或 0 ~ 100 范围会自动转换)
# 默认 60 (即 0.60)，只有置信度在这个分值以上的人体目标才会被检测、跟踪并叠加入网格/主讲人小窗。
yolo_score_threshold = 60

# 摄像头输入类型：rockit (默认，板载 MIPI 摄像头) / v4l2 (通用 USB UVC 摄像头)
camera_type = rockit

# 摄像头设备节点 (仅用于 camera_type = v4l2)
camera_node = /dev/video51


# 全局默认媒体路径：
#   video_codec=h264 时为 Annex-B 文件；
#   video_codec=mjpeg 时为单 JPEG、多 JPEG 拼接文件，或帧序列目录
h264_path = /userdata/200frames_count.h264

# PiP 下排网格测试（可选）：逗号分隔 NV12 裸文件路径（勿用分号，ini 会当作注释截断），顺序对应槽 0、1、…；
# 需 libmy_uvc_pip.ini 中 pip_tile_n_tiles>0。可只提供前 k 路，n_active=k。
# 若文件为统一源分辨率（如 640×480），设 src 后由 pip_helper RGA 缩放到各槽显示尺寸：
pip_tile_test_nv12_src_w = 640
pip_tile_test_nv12_src_h = 480
# 此时每文件大小 = ALIGN2(src_w)*ALIGN2(src_h)*3/2；不设 src 时文件须已等于槽位 ALIGN2 尺寸。
pip_tile_test_nv12_paths = /userdata/frame_640_480.nv12,/userdata/frame_640_480.nv12

# 按路覆盖（N=0~15）；留空则回退到 h264_path / 全局 fps
channel0_h264_path = /userdata/200frames_count.h264
channel0_fps = 30

channel1_h264_path = /userdata/200frames_count_1.h264
channel1_fps = 30
