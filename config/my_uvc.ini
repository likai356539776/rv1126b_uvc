[my_uvc]
# ===================== 可配置项简要说明 =====================
# channels               路数，范围 1~8
# width                  分辨率宽度，>0
# height                 分辨率高度，>0
# fps                    全局默认帧率，范围 1~120
# loop_file              文件播完是否循环，0=否，1=是
# video_codec            负载格式：h264 | mjpeg（须与 my_uvc_usb_config.sh -f 一致）
# h264_path              媒体文件：h264 时为 Annex-B；
#                       mjpeg 时可为：
#                       - 单个 .jpg/.jpeg（循环显示）
#                       - 多 JPEG 直接拼接成一个文件（按 0xFFD8 分帧）
#                       - 目录路径：读取目录下所有 .jpg/.jpeg（按文件名排序）作为帧序列
# channelN_h264_path     第 N 路文件覆盖（N=0~15）
# channelN_fps           第 N 路帧率覆盖（N=0~15，范围 1~120）
# prefer_host_fps        预留开关，0/1
# sync_to_idr_on_open    每次开流是否从 IDR 对齐，0/1
# inject_sps_pps_on_idr  发送 IDR 前是否补发 SPS/PPS，0/1
# startup_prime_frames   开流后重复发送首个 IDR+SPS/PPS 的帧数，范围 0~120
# log_every_frames       每发送多少帧打印一次发送日志，0=关闭
# idle_sleep_ms          通道未开流时轮询休眠毫秒，范围 1~2000
# log_level              日志级别：0=错误，1=信息，2=调试
# stats_enable           是否开启多路统计输出，0/1
# stats_interval_sec     统计输出周期（秒），范围 1~3600
# ==========================================================

# UVC 通道数量（1~8）
channels = 1

# 输出视频宽度（像素）
width = 640

# 输出视频高度（像素）
height = 480

# 全局默认帧率（fps）
fps = 25

# UVC 编码格式（默认 h264；mjpeg 时请先执行：my_uvc_usb_config.sh -f MJPEG ...）
video_codec = h264

# H.264 文件播放到末尾后是否循环：1=循环，0=不循环
loop_file = 1

# 全局默认 H.264 码流文件路径（Annex-B，建议包含 SPS/PPS/IDR）
h264_path = /userdata/200frames_count.h264

# 第 0 路专用文件路径（留空则使用 h264_path）
channel0_h264_path = /userdata/200frames_count.h264

# 第 0 路专用帧率（<=0 时回退到全局 fps）
channel0_fps = 25

# 第 1 路专用文件路径（示例，可按需修改）
channel1_h264_path = /userdata/200frames_count_1.h264

# 第 1 路专用帧率（示例，可按需修改）
channel1_fps = 10

# 是否优先使用主机协商帧率（预留）：1=开启，0=关闭
prefer_host_fps = 1

# 每次通道开流是否从 IDR 帧开始发送：1=开启，0=关闭
sync_to_idr_on_open = 1

# 发送 IDR 前是否自动补发 SPS/PPS：1=开启，0=关闭
inject_sps_pps_on_idr = 1

# 开流保活帧数：刚 STREAMON 时重复发送首个 IDR(+SPS/PPS) 的次数
startup_prime_frames = 8

# 发送日志打印周期：每发送 N 帧打印一次（0 表示关闭）
log_every_frames = 120

# 通道未开流时的轮询休眠时长（毫秒）
idle_sleep_ms = 10

# 日志级别：0=仅错误，1=信息+错误，2=调试+信息+错误
log_level = 1

# 是否开启多路统计（实时 fps/累计帧数/错误计数）：1=开启，0=关闭
stats_enable = 1

# 统计打印周期（秒）
stats_interval_sec = 5
