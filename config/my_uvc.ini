# =============================================================================
# 兼容用单文件配置（区段 [my_uvc]）
# -----------------------------------------------------------------------------
# 推荐：使用同目录下拆分文件，职责更清晰：
#   libmy_uvc.ini      — UVC 协议栈 / 分辨率 / 路数 / 编码与 H.264 策略
#   libmy_uvc_pip.ini  — PiP 合成相关
#   uvctest.ini        — 测试程序媒体路径与统计
#
# 若将 -c 指向「目录」（例如 /userdata），程序会依次合并上述三个文件；
# 若三者均不存在但存在本文件 my_uvc.ini，则仅加载本文件（旧部署兼容）。
# =============================================================================

[my_uvc]
channels = 1
width = 1920
height = 1080
fps = 30
video_codec = mjpeg
pip_enable = 1
pip_overlay_path = /userdata/pip_logo.jpg
pip_x = 20
pip_y = 20
pip_w = 640
pip_h = 480
pip_jpeg_quality = 100
loop_file = 1
h264_path = /userdata/200frames_count.h264
channel0_h264_path = /userdata/200frames_count.h264
channel0_fps = 30
channel1_h264_path = /userdata/200frames_count_1.h264
channel1_fps = 30
prefer_host_fps = 1
sync_to_idr_on_open = 1
inject_sps_pps_on_idr = 1
startup_prime_frames = 8
log_every_frames = 120
idle_sleep_ms = 10
log_level = 1
stats_enable = 1
stats_interval_sec = 5
