# =============================================================================
# libmy_uvc（UVC 协议栈 + 送帧）相关配置
# -----------------------------------------------------------------------------
# 说明：本文件仅描述与 libmy_uvc 职责相关的项——协商分辨率、路数、编码类型、
#       H.264 发送策略、轮询休眠、日志级别等。与 PiP 合成、测试媒体路径无关。
# 区段名：必须使用 [libmy_uvc]
# 合并顺序：若使用配置目录方式加载，建议顺序为
#   libmy_uvc.ini -> libmy_uvc_pip.ini -> uvctest.ini（后者覆盖同名逻辑项时以最后为准）
# =============================================================================

[libmy_uvc]

# UVC 路数（1~16，与 kMaxUvcChannels 一致）
channels = 1

# 与主机协商的输出分辨率（像素）
width = 1920
height = 1080

# 全局默认帧率（fps），1~120
fps = 30

# 负载格式：h264 | mjpeg（须与设备上 my_uvc_usb_config.sh -f 一致）
video_codec = mjpeg

# H.264 文件播放到末尾后是否循环：1=循环，0=停止
loop_file = 1

# 是否优先使用主机协商帧率（预留）：1=开，0=关
prefer_host_fps = 1

# 每次通道开流是否从 IDR 对齐：1=开，0=关
sync_to_idr_on_open = 1

# 发送 IDR 前是否自动补发 SPS/PPS：1=开，0=关
inject_sps_pps_on_idr = 1

# 开流后重复发送首个 IDR(+SPS/PPS) 的次数，0~120
startup_prime_frames = 8

# 通道未开流时轮询休眠（毫秒），1~2000
idle_sleep_ms = 10

# 日志级别：0=仅错误，1=信息，2=调试
log_level = 1
